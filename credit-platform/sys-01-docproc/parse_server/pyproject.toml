[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-sys01-parse"
version = "1.0.0"
requires-python = ">=3.11"

# docling 通过 pluggy 从 entry point 组 docling 发现插件模块，
# 模块需暴露 ocr_engines() 返回 {"ocr_engines": [ModelClass]}
[project.entry-points.docling]
credit_sys01_ocr = "app.ocr_plugin"

[tool.setuptools]
packages = ["app"]
